[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pam_ipa_project"
version = "0.4.0"
description = "Autenticación y autorización por roles de AetherLynx"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
test = ["pytest>=8", "httpx>=0.27", "pyjwt>=2.8"]

[tool.maturin]
features = ["extension-module"]
