[package]
name = "pam_ipa_project"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Autenticación (PAM) y autorización por roles (IPA) de AetherLynx, con bindings para Python"
license = "Apache-2.0"
repository = "https://github.com/jclanas2019/AetherLynxSDK"
authors = ["Juan Carlos Lanas <jc@lab-ai.org>"]
keywords = ["authentication", "rbac", "argon2", "jwt", "python"]
categories = ["authentication"]

[lib]
name = "pam_ipa_project"
crate-type = ["cdylib", "rlib"]

[dependencies]
# >= 0.29 corrige RUSTSEC-2025-0020, RUSTSEC-2026-0176 y RUSTSEC-2026-0177
pyo3 = { version = "0.30", features = ["abi3-py39"] }
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[features]
# maturin activa esta feature (ver pyproject.toml); `cargo test` la deja apagada
# para poder enlazar los tests contra libpython.
extension-module = ["pyo3/extension-module"]
