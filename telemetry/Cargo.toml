[package]
name = "aetherlynx-telemetry"
description = "Colector de telemetría de AetherLynx: receptor OTLP/HTTP, almacenamiento, alertas y panel web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "aetherlynx_telemetry"
path = "src/lib.rs"

[[bin]]
name = "aetherlynx-telemetry"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
serde_json.workspace = true
prost.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Solo los tipos de mensaje OTLP (sin servicios gRPC).
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
subtle = "2.6"
flate2 = "1"
hex = "0.4"
humantime = "2.1"
# TLS propio (sin rustls-pemfile, que no tiene mantenimiento).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1.11"
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }

[features]
# Constructores de peticiones OTLP para tests de integración.
test-fixtures = []

[dev-dependencies]
aetherlynx-telemetry = { path = ".", features = ["test-fixtures"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
