apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-agent
  namespace: aetherlynx
  labels:
    app.kubernetes.io/name: university-agent
    app.kubernetes.io/part-of: aetherlynx
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: university-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: university-agent
        app.kubernetes.io/part-of: aetherlynx
    spec:
      serviceAccountName: university-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: university-agent
      containers:
        - name: university-agent
          # Fije la versión exacta; en producción, mejor por digest (@sha256:...).
          image: registry.example.com/aetherlynx/university-agent:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: university-agent-config
            - secretRef:
                name: university-agent-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: university-agent
  namespace: aetherlynx
  labels:
    app.kubernetes.io/name: university-agent
spec:
  selector:
    app.kubernetes.io/name: university-agent
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: university-agent
  namespace: aetherlynx
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: university-agent
