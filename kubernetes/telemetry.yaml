# Colector de telemetría de AetherLynx: recibe OTLP/HTTP en 4318, guarda en
# SQLite (volumen persistente) y sirve el panel y la API de consulta en 8088.
#
# Requisitos previos (vea kubernetes/examples/telemetry-secret.example.yaml):
#   - Secret aetherlynx-telemetry-ingest (token, otlp-headers)
#   - Secret aetherlynx-telemetry-query  (token)
#   - Secret aetherlynx-telemetry-tls    de tipo kubernetes.io/tls
#   - ConfigMap aetherlynx-telemetry-ca  (ca.crt: la CA que firmó el anterior)
#
# Los clientes (orquestador y agentes) leen el ConfigMap
# aetherlynx-telemetry-client definido aquí. Es opcional para ellos: si no se
# despliega este archivo, arrancan igual y simplemente no exportan.
#
# Una sola réplica: SQLite no admite escritores en varios pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aetherlynx-telemetry-client
  namespace: aetherlynx
data:
  # El nombre DNS debe coincidir con el certificado del colector.
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://aetherlynx-telemetry.aetherlynx.svc:4318"
  OTEL_EXPORTER_OTLP_CERTIFICATE: "/etc/aetherlynx/telemetry-ca/ca.crt"
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aetherlynx-telemetry
  namespace: aetherlynx
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetherlynx-telemetry
  namespace: aetherlynx
  labels:
    app.kubernetes.io/name: aetherlynx-telemetry
    app.kubernetes.io/part-of: aetherlynx
spec:
  replicas: 1
  # Recreate: el volumen RWO y SQLite admiten un solo pod a la vez.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aetherlynx-telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aetherlynx-telemetry
        app.kubernetes.io/part-of: aetherlynx
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry
          image: registry.example.com/aetherlynx/telemetry:0.4.0
          imagePullPolicy: IfNotPresent
          args:
            - --otlp-listen=0.0.0.0:4318
            - --ui-listen=0.0.0.0:8088
            - --db=/data/telemetry.db
            - --retention=72h
            # Por debajo de los 2Gi del volumen: deja sitio al WAL.
            - --max-db-mib=1536
            - --log-format=json
          ports:
            - name: otlp
              containerPort: 4318
            - name: ui
              containerPort: 8088
          env:
            - name: AETHERLYNX_TELEMETRY_INGEST_TOKEN
              valueFrom:
                secretKeyRef: { name: aetherlynx-telemetry-ingest, key: token }
            - name: AETHERLYNX_TELEMETRY_TOKEN
              valueFrom:
                secretKeyRef: { name: aetherlynx-telemetry-query, key: token }
            - name: AETHERLYNX_TELEMETRY_TLS_CERT
              value: /tls/tls.crt
            - name: AETHERLYNX_TELEMETRY_TLS_KEY
              value: /tls/tls.key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Hasta 8 lotes de 32 MiB descomprimidos a la vez, más la caché.
              memory: 768Mi
          # El kubelet no verifica el certificado en sondas HTTPS.
          startupProbe:
            httpGet: { path: /healthz, port: ui, scheme: HTTPS }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: ui, scheme: HTTPS }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: ui, scheme: HTTPS }
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aetherlynx-telemetry
        - name: tls
          secret:
            secretName: aetherlynx-telemetry-tls
            defaultMode: 288  # 0440 en octal; en decimal para que ningún parser YAML dude
---
apiVersion: v1
kind: Service
metadata:
  name: aetherlynx-telemetry
  namespace: aetherlynx
  labels:
    app.kubernetes.io/name: aetherlynx-telemetry
spec:
  selector:
    app.kubernetes.io/name: aetherlynx-telemetry
  ports:
    - name: otlp
      port: 4318
      targetPort: otlp
    - name: ui
      port: 8088
      targetPort: ui
---
# Entrada OTLP (4318): solo los componentes de AetherLynx que emiten
# telemetría, más pods con aetherlynx.io/telemetry-client=true.
# Entrada al panel (8088): pods con aetherlynx.io/telemetry-viewer=true; para
# un acceso puntual, kubectl port-forward. Como en las otras políticas, las
# etiquetas no autentican: el control real son los tokens.
# Salida: ninguna. El colector no necesita hablar con nadie.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aetherlynx-telemetry
  namespace: aetherlynx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aetherlynx-telemetry
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: llm-agent
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aetherlynx-orchestrator
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              aetherlynx.io/telemetry-client: "true"
      ports:
        - { port: 4318, protocol: TCP }
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              aetherlynx.io/telemetry-viewer: "true"
      ports:
        - { port: 8088, protocol: TCP }
  egress: []
