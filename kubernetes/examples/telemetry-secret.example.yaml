# PLANTILLA. Está fuera de kubernetes/ a propósito: `kubectl apply -f kubernetes/`
# no la aplica. No la versione con valores reales.
#
# Lo más simple es crear los objetos con kubectl:
#
#   INGEST="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')"
#   kubectl -n aetherlynx create secret generic aetherlynx-telemetry-ingest \
#     --from-literal=token="$INGEST" \
#     --from-literal=otlp-headers="Authorization=Bearer%20$INGEST"
#   kubectl -n aetherlynx create secret generic aetherlynx-telemetry-query \
#     --from-literal=token="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')"
#
# Certificado del colector (el nombre DNS debe ser
# aetherlynx-telemetry.aetherlynx.svc) y su CA, para que los clientes lo
# verifiquen:
#   kubectl -n aetherlynx create secret tls aetherlynx-telemetry-tls --cert=tls.crt --key=tls.key
#   kubectl -n aetherlynx create configmap aetherlynx-telemetry-ca --from-file=ca.crt=ca.crt
# Con cert-manager: un Certificate con secretName aetherlynx-telemetry-tls y
# trust-manager (o una copia manual) para el ConfigMap de la CA.
#
# Dos tokens distintos: el de ingesta lo tienen todos los pods que emiten
# telemetría; el de consulta, solo quien mira el panel. Filtrar el primero
# permite inyectar datos falsos, no leerlos.
apiVersion: v1
kind: Secret
metadata:
  name: aetherlynx-telemetry-ingest
  namespace: aetherlynx
type: Opaque
stringData:
  # El colector exige al menos 32 caracteres: este valor no arranca.
  token: "REEMPLAZAR"
  # Mismo token, en el formato de OTEL_EXPORTER_OTLP_HEADERS (%20 = espacio).
  otlp-headers: "Authorization=Bearer%20REEMPLAZAR"
---
apiVersion: v1
kind: Secret
metadata:
  name: aetherlynx-telemetry-query
  namespace: aetherlynx
type: Opaque
stringData:
  token: "REEMPLAZAR"
