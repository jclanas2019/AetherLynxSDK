# PLANTILLA. Está fuera de kubernetes/ a propósito: `kubectl apply -f kubernetes/`
# no la aplica. No la versione con valores reales.
#
# Token del API del orquestador:
#   kubectl -n aetherlynx create secret generic orchestrator-secrets \
#     --from-literal=api-token="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')"
#
# Certificado TLS (el nombre DNS debe coincidir con el que usen los clientes,
# p. ej. aetherlynx-orchestrator.aetherlynx.svc):
#   kubectl -n aetherlynx create secret tls orchestrator-tls --cert=tls.crt --key=tls.key
# o con cert-manager, un Certificate con secretName: orchestrator-tls.
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secrets
  namespace: aetherlynx
type: Opaque
stringData:
  # El orquestador exige al menos 32 caracteres: este valor no arranca.
  api-token: "REEMPLAZAR"
