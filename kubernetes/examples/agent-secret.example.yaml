# PLANTILLA. Está fuera de kubernetes/ a propósito: `kubectl apply -f kubernetes/`
# no la aplica. No la versione con valores reales.
# Cree el secreto así (o con su gestor de secretos / External Secrets):
#
#   kubectl -n aetherlynx create secret generic university-agent-secrets \
#     --from-literal=OPENAI_API_KEY='...' \
#     --from-literal=UNIVERSITY_API_TOKEN='...' \
#     --from-literal=AETHERLYNX_AGENT_TOKEN="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"
apiVersion: v1
kind: Secret
metadata:
  name: university-agent-secrets
  namespace: aetherlynx
type: Opaque
stringData:
  OPENAI_API_KEY: "REEMPLAZAR"
  UNIVERSITY_API_TOKEN: "REEMPLAZAR"
  # El servicio rechaza cualquier valor que contenga "REEMPLAZAR".
  AETHERLYNX_AGENT_TOKEN: "REEMPLAZAR"
